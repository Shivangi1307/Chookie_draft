<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wappalyzer Clone</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 40px;
        }

        .box {
            max-width: 500px;
            margin: auto;
            padding: 25px;
            background: #1e293b;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #4338ca;
        }

        #result {
            margin-top: 20px;
            text-align: left;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            min-height: 60px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Wappalyzer Clone</h1>
    <p>Enter a website URL to detect technologies</p>

    <div class="box">
        <input id="urlInput" placeholder="https://example.com">
        <button onclick="scanWebsite()">Scan Website</button>
        
        <div id="result">Results will appear here...</div>
    </div>

    <script>
        async function scanWebsite() {
            const url = document.getElementById("urlInput").value;
            if (!url) return alert("Please enter a URL");

            document.getElementById("result").innerText = "Scanning...";

            try {
                const response = await fetch("http://localhost:3000/scan", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();
                document.getElementById("result").innerText =
                    JSON.stringify(data.tech, null, 2);

            } catch (err) {
                document.getElementById("result").innerText = "Error connecting to backend.";
            }
        }
    </script>

</body>
</html>
