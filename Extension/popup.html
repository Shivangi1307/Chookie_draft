<!DOCTYPE html>
<html>
<head>
  <style>

    /* Popup size */
    body {
      position: relative;       /* required for absolute blob */
      overflow: hidden;         /* prevents gradient bleed */
      min-height: 400px;
      font-family: Arial;
      width: 250px;
      padding: 10px;
      background-color: black;
      color: white;             
    }

    #scoreMeterContainer {
      margin-top: 10px;
      text-align: center;
      display: none;
    }

    #scoreBarOuter {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 5px;
    }

    #scoreBarInner {
      height: 100%;
      width: 0%;
      background: red;
      transition: width 0.4s ease;
    }

    #toggleTableBtn {
      margin-top: 12px;
      width: 100%;
      padding: 6px;
      cursor: pointer;
    }

    #cookieTable {
      width: 100%;
      margin-top: 10px;
      border-collapse: collapse;
      display: none;
    }

    #cookieTable th, #cookieTable td {
      border: 1px solid #ccc;
      padding: 4px;
      font-size: 12px;
    }

    #cookieButton {
      width: 100px;
      height: 100px;
      border-radius: 100px;
      background: #000;
      box-shadow: -30px 20px 70px 0 rgba(102, 160, 198, 0.40),
                  0 0 60px 0 rgba(220, 220, 220, 0.70) inset;
    }

    /* 🎨 Blue gradient blob */
    .gradient-blob {
      position: absolute;
      top: 180px;    
      left: 10px;

      width: 260px;
      height: 260px;

      border-radius: 267px;
      transform: rotate(-7.252deg);

      background: linear-gradient(
        45deg,
        #6FB9EA 16.1%,
        #0636BC 59.53%,
        #06133C 126.28%
      );

      filter: blur(33px);
      z-index: -2;
      opacity: 0.9;
    }

    /* 🟣 SVG blob container */
    #svg_blob {
      position: absolute;

      /* Positioning — adjust as needed */
      top: 120px;      
      left: -20px;

      background-color: #1e445c;

      /* Scaled size of original 1135×915 */
      width: 300px;
      height: 240px;

      z-index: -3;
      opacity: 0.25;   /* light background effect */
    }

    #svg_blob svg {
      width: 100%;
      height: 100%;
    }

  </style>
</head>
<body>

  <!-- 🟣 SVG background blob added here -->
  
  

  <!-- 🎨 Blue gradient blur blob -->
  <div class="gradient-blob"></div>

  <button id="scanCookies">Scan Cookies</button>
  <div id="result"></div>

  <!-- Score Meter -->
  <div id="scoreMeterContainer">
    <h4>Total Risk Score</h4>
    <div id="scoreBarOuter">
      <div id="scoreBarInner"></div>
    </div>
    <div id="scoreValue"></div>
  </div>

  <!-- Toggle Table -->
  <button id="toggleTableBtn">Show Cookie Table</button>

  <!-- Cookie Table -->
  <table id="cookieTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Secure</th>
        <th>HttpOnly</th>
        <th>SameSite</th>
        <th>Score</th>
        <th>Level</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="popup.js"></script>
</body>
</html>
